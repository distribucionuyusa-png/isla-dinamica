# Publica una versión de Isla dinámica cuando se sube una etiqueta vX.Y.Z.
# El instalador debe estar en dist/IslaDinamica-Setup-X.Y.Z.exe en el commit etiquetado.
# Las islas instaladas leen la release "latest" y se actualizan solas (verifican el SHA-256 que publica GitHub).
name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear la release con el instalador
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          SETUP="dist/IslaDinamica-Setup-${VERSION}.exe"
          test -f "$SETUP" || { echo "Falta $SETUP"; exit 1; }
          NOTES="dist/NOTAS-${VERSION}.md"
          if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--notes "Isla dinámica ${VERSION}"); fi
          gh release create "$TAG" "$SETUP" --repo "$GITHUB_REPOSITORY" --title "Isla dinámica ${VERSION}" "${NOTES_ARG[@]}" --latest
