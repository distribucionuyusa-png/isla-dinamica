# Publica una versión de Isla dinámica cuando se sube un instalador nuevo a dist/ en la rama "publicaciones".
# La versión sale del nombre del archivo (dist/IslaDinamica-Setup-X.Y.Z.exe, el número más alto).
# Crea la etiqueta vX.Y.Z y la release "latest"; las islas instaladas la leen y se actualizan solas
# (verifican el SHA-256 que publica GitHub). Si esa versión ya está publicada, no hace nada.
name: Publicar versión

on:
  push:
    branches: [publicaciones]
    paths:
      - "dist/IslaDinamica-Setup-*.exe"
      - "dist/NOTAS-*.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear la release con el instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SETUP=$(ls dist/IslaDinamica-Setup-*.exe | sort -V | tail -1)
          VERSION=$(basename "$SETUP" .exe | sed 's/^IslaDinamica-Setup-//')
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión $TAG ya está publicada."
            exit 0
          fi
          NOTES="dist/NOTAS-${VERSION}.md"
          if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--notes "Isla dinámica ${VERSION}"); fi
          gh release create "$TAG" "$SETUP" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Isla dinámica ${VERSION}" "${NOTES_ARG[@]}" --latest
